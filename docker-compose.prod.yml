version: '3.8'

services:
  api:
    build:
      context: .
      target: production
    container_name: cloud-anomaly-prod
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=prod
      - BUILD_TARGET=production
      - LOG_LEVEL=warning
    env_file:
      - .env.prod
    volumes:
      - ./logs:/app/logs:ro
      - ./data:/app/data:ro
    networks:
      - anomaly-prod-network
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: anomaly-redis-prod
    command: redis-server --appendonly yes
    volumes:
      - redis-data-prod:/data
    networks:
      - anomaly-prod-network
    restart: always

networks:
  anomaly-prod-network:
    driver: bridge

volumes:
  redis-data-prod: