version: '3.8'

services:
  api:
    build:
      context: .
      target: production
    container_name: cloud-anomaly-stg
    ports:
      - "8002:8000"
    environment:
      - ENVIRONMENT=stg
      - BUILD_TARGET=production
      - LOG_LEVEL=info
    env_file:
      - .env.stg
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data:ro
    networks:
      - anomaly-stg-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: anomaly-redis-stg
    networks:
      - anomaly-stg-network
    restart: unless-stopped

networks:
  anomaly-stg-network:
    driver: bridge