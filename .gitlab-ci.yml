image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  CONTAINER_TEST_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  CONTAINER_RELEASE_IMAGE: $CI_REGISTRY_IMAGE:latest

stages:
  - validate
  - test
  - build
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "stg"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ========== VALIDATION ==========
validate:
  stage: validate
  image: python:3.10
  script:
    - python --version
    - pip install -r requirements.txt
    - python -m py_compile src/main.py
    - python -c "import yaml; yaml.safe_load(open('docker-compose.dev.yml'))"
    - python -c "import yaml; yaml.safe_load(open('docker-compose.stg.yml'))"
    - python -c "import yaml; yaml.safe_load(open('docker-compose.prod.yml'))"
  only:
    - dev
    - stg
    - main

# ========== TEST ==========
test:dev:
  stage: test
  image: python:3.10
  variables:
    ENVIRONMENT: dev
  before_script:
    - pip install -r requirements.txt
  script:
    - python -m pytest tests/ -v --cov=src --cov-report=xml
    - python src/test_client.py
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  only:
    - dev

test:stg:
  stage: test
  image: python:3.10
  variables:
    ENVIRONMENT: stg
  before_script:
    - pip install -r requirements.txt
  script:
    - python -m pytest tests/ -v --cov=src --cov-report=xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  only:
    - stg

test:prod:
  stage: test
  image: python:3.10
  variables:
    ENVIRONMENT: prod
  before_script:
    - pip install -r requirements.txt
  script:
    - python -m pytest tests/ -v --cov=src --cov-report=xml
  only:
    - main

# ========== BUILD ==========
build:dev:
  stage: build
  variables:
    ENVIRONMENT: dev
    BUILD_TARGET: development
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --target development -t $CONTAINER_TEST_IMAGE .
    - docker tag $CONTAINER_TEST_IMAGE $CI_REGISTRY_IMAGE:dev-latest
    - docker push $CONTAINER_TEST_IMAGE
    - docker push $CI_REGISTRY_IMAGE:dev-latest
  only:
    - dev
  when: manual

build:stg:
  stage: build
  variables:
    ENVIRONMENT: stg
    BUILD_TARGET: production
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --target production -t $CONTAINER_TEST_IMAGE .
    - docker tag $CONTAINER_TEST_IMAGE $CI_REGISTRY_IMAGE:stg-latest
    - docker push $CONTAINER_TEST_IMAGE
    - docker push $CI_REGISTRY_IMAGE:stg-latest
  only:
    - stg
  when: manual

build:prod:
  stage: build
  variables:
    ENVIRONMENT: prod
    BUILD_TARGET: production
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --target production -t $CONTAINER_TEST_IMAGE .
    - docker tag $CONTAINER_TEST_IMAGE $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker tag $CONTAINER_TEST_IMAGE $CI_REGISTRY_IMAGE:prod-latest
    - docker push $CONTAINER_TEST_IMAGE
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:prod-latest
  only:
    - main
  when: manual

# ========== DEPLOY ==========
deploy:dev:
  stage: deploy
  image: alpine:latest
  variables:
    ENVIRONMENT: dev
  before_script:
    - apk add --no-cache openssh-client docker-cli
    - eval $(ssh-agent -s)
    - echo "$DEV_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - |
      ssh -o StrictHostKeyChecking=no $DEV_USER@$DEV_SERVER "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $CI_REGISTRY_IMAGE:dev-$CI_COMMIT_SHORT_SHA &&
        cd /opt/cloud-anomaly &&
        docker-compose -f docker-compose.dev.yml down &&
        docker-compose -f docker-compose.dev.yml up -d
      "
  environment:
    name: development
    url: http://dev.anomaly.example.com
  only:
    - dev
  when: manual

deploy:stg:
  stage: deploy
  image: alpine:latest
  variables:
    ENVIRONMENT: stg
  before_script:
    - apk add --no-cache openssh-client docker-cli
    - eval $(ssh-agent -s)
    - echo "$STG_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - |
      ssh -o StrictHostKeyChecking=no $STG_USER@$STG_SERVER "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $CI_REGISTRY_IMAGE:stg-$CI_COMMIT_SHORT_SHA &&
        cd /opt/cloud-anomaly &&
        docker-compose -f docker-compose.stg.yml down &&
        docker-compose -f docker-compose.stg.yml up -d
      "
  environment:
    name: staging
    url: http://stg.anomaly.example.com
  only:
    - stg
  when: manual

deploy:prod:
  stage: deploy
  image: alpine:latest
  variables:
    ENVIRONMENT: prod
  before_script:
    - apk add --no-cache openssh-client docker-cli
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - |
      ssh -o StrictHostKeyChecking=no $PROD_USER@$PROD_SERVER "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA &&
        cd /opt/cloud-anomaly &&
        docker-compose -f docker-compose.prod.yml down &&
        docker-compose -f docker-compose.prod.yml up -d
      "
  environment:
    name: production
    url: http://anomaly.example.com
  only:
    - main
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual