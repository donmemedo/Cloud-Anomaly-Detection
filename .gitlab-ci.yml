stages:
  - validate
  - test
  - build
  - security
  - deploy
  - notify

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  DOCKER_TAG_LATEST: $CI_REGISTRY_IMAGE:latest
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"

# Cache configuration
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .venv/
    - .cache/pip

# Workflow rules
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "stg"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# ========== VALIDATION STAGE ==========
validate:code:
  stage: validate
  image: python:3.10
  script:
    - pip install flake8 black isort mypy
    - flake8 main.py --max-line-length=120
    - black --check main.py
    - isort --check-only main.py
    - mypy main.py --ignore-missing-imports
  only:
    - dev
    - stg
    - main

validate:config:
  stage: validate
  image: python:3.10
  script:
    - python -m py_compile main.py
    - python -c "import yaml; yaml.safe_load(open('docker-compose.dev.yml'))"
    - python -c "import yaml; yaml.safe_load(open('docker-compose.stg.yml'))"
    - python -c "import yaml; yaml.safe_load(open('docker-compose.prod.yml'))"
  only:
    - dev
    - stg
    - main

# ========== TEST STAGE ==========
.test_template: &test_definition
  stage: test
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install -r requirements.txt
    - pip install -r requirements-test.txt
  script:
    - pytest tests/ -v --cov=main --cov-report=xml --cov-report=html
    - python -m pytest tests/ --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
  coverage: '/TOTAL.*\s+(\d+%)$/'

test:dev:
  <<: *test_definition
  image: python:3.10
  variables:
    ENVIRONMENT: development
  only:
    - dev
  allow_failure: false

test:stg:
  <<: *test_definition
  image: python:3.11
  variables:
    ENVIRONMENT: staging
  only:
    - stg
  allow_failure: false

test:prod:
  <<: *test_definition
  image: python:3.10
  variables:
    ENVIRONMENT: production
  only:
    - main
  allow_failure: false

# ========== BUILD STAGE ==========
build:dev:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    BUILD_TARGET: development
    ENVIRONMENT: development
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --target development -t $DOCKER_IMAGE .
    - docker tag $DOCKER_IMAGE $CI_REGISTRY_IMAGE:dev-latest
    - docker push $DOCKER_IMAGE
    - docker push $CI_REGISTRY_IMAGE:dev-latest
  only:
    - dev
  when: manual

build:stg:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    BUILD_TARGET: production
    ENVIRONMENT: staging
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --target production -t $DOCKER_IMAGE .
    - docker tag $DOCKER_IMAGE $CI_REGISTRY_IMAGE:stg-latest
    - docker push $DOCKER_IMAGE
    - docker push $CI_REGISTRY_IMAGE:stg-latest
  only:
    - stg
  when: manual

build:prod:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    BUILD_TARGET: production
    ENVIRONMENT: production
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --target production -t $DOCKER_IMAGE .
    - docker tag $DOCKER_IMAGE $CI_REGISTRY_IMAGE:prod-latest
    - docker tag $DOCKER_IMAGE $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_IMAGE
    - docker push $CI_REGISTRY_IMAGE:prod-latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  only:
    - main
  when: manual

# ========== SECURITY STAGE ==========
security:scan:
  stage: security
  image: docker:latest
  services:
    - docker:dind
  script:
    - |
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v $CI_PROJECT_DIR:/src \
        aquasec/trivy:latest \
        filesystem --severity HIGH,CRITICAL /src
    - |
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        aquasec/trivy:latest \
        image --severity HIGH,CRITICAL $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  only:
    - stg
    - main
  allow_failure: true

# ========== DEPLOY STAGE ==========
deploy:dev:
  stage: deploy
  image: alpine:latest
  variables:
    ENVIRONMENT: development
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$DEV_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEV_SERVER >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEV_USER@$DEV_SERVER "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $CI_REGISTRY_IMAGE:dev-$CI_COMMIT_SHORT_SHA &&
        docker-compose -f /opt/cloud-anomaly/docker-compose.dev.yml down &&
        docker-compose -f /opt/cloud-anomaly/docker-compose.dev.yml up -d
      "
  environment:
    name: development
    url: https://dev.anomaly.example.com
  only:
    - dev
  when: manual

deploy:stg:
  stage: deploy
  image: alpine:latest
  variables:
    ENVIRONMENT: staging
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$STG_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $STG_SERVER >> ~/.ssh/known_hosts
  script:
    - |
      ssh $STG_USER@$STG_SERVER "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $CI_REGISTRY_IMAGE:stg-$CI_COMMIT_SHORT_SHA &&
        docker-compose -f /opt/cloud-anomaly/docker-compose.stg.yml down &&
        docker-compose -f /opt/cloud-anomaly/docker-compose.stg.yml up -d &&
        sleep 10 &&
        curl -f http://localhost:8002/health || exit 1
      "
  environment:
    name: staging
    url: https://stg.anomaly.example.com
  only:
    - stg
  when: manual

deploy:prod:
  stage: deploy
  image: alpine:latest
  variables:
    ENVIRONMENT: production
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $PROD_SERVER >> ~/.ssh/known_hosts
  script:
    - |
      ssh $PROD_USER@$PROD_SERVER "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA &&
        docker-compose -f /opt/cloud-anomaly/docker-compose.prod.yml down &&
        docker-compose -f /opt/cloud-anomaly/docker-compose.prod.yml up -d &&
        sleep 30 &&
        curl -f https://anomaly.example.com/health || exit 1
      "
  environment:
    name: production
    url: https://anomaly.example.com
  only:
    - main
  when: manual
  dependencies:
    - security:scan
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false

# ========== NOTIFICATION STAGE ==========
notify:slack:
  stage: notify
  image: curlimages/curl:latest
  script:
    - |
      if [ "$CI_JOB_STATUS" == "success" ]; then
        COLOR="good"
        EMOJI="✅"
      else
        COLOR="danger"
        EMOJI="❌"
      fi

      curl -X POST $SLACK_WEBHOOK_URL \
        -H "Content-Type: application/json" \
        -d "{
          \"attachments\": [{
            \"color\": \"$COLOR\",
            \"title\": \"$EMOJI $CI_PROJECT_NAME - $CI_COMMIT_REF_NAME\",
            \"fields\": [
              {\"title\": \"Status\", \"value\": \"$CI_JOB_STATUS\", \"short\": true},
              {\"title\": \"Branch\", \"value\": \"$CI_COMMIT_REF_NAME\", \"short\": true},
              {\"title\": \"Commit\", \"value\": \"$CI_COMMIT_TITLE\", \"short\": false},
              {\"title\": \"Pipeline\", \"value\": \"$CI_PIPELINE_URL\", \"short\": false}
            ],
            \"ts\": $(date +%s)
          }]
        }"
  when: always