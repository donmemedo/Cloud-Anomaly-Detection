version: '3.8'

services:
  api:
    build:
      context: .
      target: development
    container_name: cloud-anomaly-dev
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=dev
      - BUILD_TARGET=development
      - LOG_LEVEL=debug
    env_file:
      - .env.dev
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./data:/app/data
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - anomaly-dev-network

  redis:
    image: redis:7-alpine
    container_name: anomaly-redis-dev
    ports:
      - "6380:6379"
    networks:
      - anomaly-dev-network

networks:
  anomaly-dev-network:
    driver: bridge