version: '3.8'

services:
  api:
    <<: *app-config
    container_name: cloud-anomaly-dev
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=development
      - BUILD_TARGET=development
      - LOG_LEVEL=debug
    volumes:
      - .:/app
      - /app/.venv
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:15
    container_name: anomaly-postgres-dev
    environment:
      - POSTGRES_USER=dev_user
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_DB=anomaly_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    networks:
      - anomaly-network

  redis:
    image: redis:7-alpine
    container_name: anomaly-redis-dev
    ports:
      - "6380:6379"
    networks:
      - anomaly-network

networks:
  anomaly-network:
    driver: bridge

volumes:
  postgres-data-dev:
  redis-data-dev: