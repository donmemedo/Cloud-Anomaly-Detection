version: '3.8'

x-app-config: &app-config
  build:
    context: .
    target: ${BUILD_TARGET:-development}
  env_file:
    - .env.${ENVIRONMENT:-dev}
  volumes:
    - ./logs:/app/logs
    - ./data:/app/data
  networks:
    - anomaly-network
  restart: unless-stopped

services:
  api:
    <<: *app-config
    container_name: cloud-anomaly-${ENVIRONMENT:-dev}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: anomaly-redis-${ENVIRONMENT:-dev}
    networks:
      - anomaly-network

networks:
  anomaly-network:
    driver: bridge

volumes:
  redis-data: